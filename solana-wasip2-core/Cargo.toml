[package]
name = "solana-wasip2-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Solana primitives for wasm32-wasip2 WebAssembly components: JSON-RPC over wasi:http, unsigned versioned transaction construction, durable nonce handling, Solana Pay URLs, payment settlement verification, and token mint risk inspection. Pure core, host-testable."
repository = "https://github.com/Andy00L/zeroclaw-plugins"
readme = "README.md"
keywords = ["solana", "wasm", "wasip2", "wasi", "zeroclaw"]
categories = ["wasm", "cryptography::cryptocurrencies"]
# Package only what a library consumer needs; the oracle tooling, fixtures,
# and proof harness live in the repository, not in the crate archive.
include = ["/src", "/Cargo.toml", "/README.md", "/LICENSE", "/EVIDENCE.md"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bincode 1.x produces the canonical Solana wire encoding for transactions and
# nonce account state (shortvec handled by the solana-* serde impls).
bincode = "1.3"
base64 = "0.22"
percent-encoding = "2.3"
solana-pubkey = "4.2"
solana-hash = "4.5"
solana-instruction = "3.4"
solana-message = { version = "4.4", features = ["serde"] }
solana-transaction = { version = "4.1", features = ["serde"] }
solana-signature = "3.4"
solana-system-interface = { version = "3.2", features = ["bincode"] }
solana-nonce = { version = "3.2", features = ["serde"] }
spl-token-interface = "2"
spl-associated-token-account-interface = "2"
spl-memo-interface = "2.1"

# waki binds wasi:http; it only builds for wasm targets. Host tests mock HTTP
# through the JsonHttpTransport trait instead (same pattern as the telegram
# plugin in zeroclaw-plugins).
[target.'cfg(target_family = "wasm")'.dependencies]
waki = { version = "0.5", features = ["json"] }

[dev-dependencies]
# Native program ids asserted in wire-level transaction tests.
solana-sdk-ids = "3.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Standalone crate: consumed by plugin crates via a path dependency, not part
# of a host workspace.
[workspace]
