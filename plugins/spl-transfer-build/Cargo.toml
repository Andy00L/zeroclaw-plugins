[package]
name = "spl-transfer-build"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw WIT tool plugin: build unsigned SPL transfer transactions with recipient allowlist, per-call caps, an on-chain mint risk gate, and durable nonce support. Holds no key (custody tier T1)."
publish = false

# cdylib for the wasm component; rlib so the pure transfer core is testable
# on the host with a plain `cargo test`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-wasip2-core = "0.1.0"

# Host-test-only: decode the produced base64 transactions and synthesize
# nonce account state exactly as the chain stores it.
[dev-dependencies]
base64 = "0.22"
bincode = "1.3"
solana-hash = "4.5"
solana-nonce = { version = "3.2", features = ["serde"] }
solana-sdk-ids = "3.1"
solana-transaction = { version = "4.1", features = ["serde"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Standalone crate: built for wasm32-wasip2, not part of the host workspace.
[workspace]
