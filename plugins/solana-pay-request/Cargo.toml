[package]
name = "solana-pay-request"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw WIT tool plugin: create Solana Pay transfer request URLs (payment terminal). The recipient is operator-configured only; the model cannot redirect funds. Zero secrets, zero RPC (custody tier T1)."
publish = false

# cdylib for the wasm component; rlib so the pure request core is testable on
# the host with a plain `cargo test`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-wasip2-core = "0.1.0"

# Reference keys are random 32-byte values; wasip2 serves them through the
# WASI 0.2 random interface. Host tests inject a fixed generator instead.
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = "0.3"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Standalone crate: built for wasm32-wasip2, not part of the host workspace.
[workspace]
